<script>
/* Jazyk: kdo nemá uloženou volbu a má prohlížeč v jiném jazyce než CZ/SK, dostane anglickou verzi.
   Vyhledávače (Google, Seznam, Bing…) se nepřesměrovávají, aby indexovaly obě verze zvlášť. */
(function () {
  var PAGE_LANG = "en";
  if (/bot|crawl|spider|slurp|seznam|lighthouse|headless|preview|facebookexternalhit/i.test(navigator.userAgent || "")) return;
  var saved = null;
  try { saved = localStorage.getItem("vride-lang"); } catch (e) {}
  var browser = ((navigator.languages && navigator.languages[0]) || navigator.language || "").slice(0, 2).toLowerCase();
  var want = (saved === "cs" || saved === "en") ? saved : ((browser === "cs" || browser === "sk") ? "cs" : "en");
  if (PAGE_LANG === "cs" && want === "en") location.replace("/en/");
  else if (PAGE_LANG === "en" && saved === "cs") location.replace("/");
})();
</script>

<script>
/* ===== Nastavení Supabase ===== */
const SUPABASE_URL = "https://ddzuuzlptwfqhvxzewcv.supabase.co";
const SUPABASE_KEY = "sb_publishable_xPwusmzYbiLdK8S74Z6h3Q_XoSdnYFD";
const PAGE_LANG = "en";
const T = {
  "ok": "Done. We'll email you the link when VRide launches.",
  "errEmail": "Enter a valid email address.",
  "errConsent": "Please confirm consent to email processing.",
  "errNet": "Your email couldn't be saved. Try again in a moment."
};

/* Kliknutí na CZ/EN si zapamatuje volbu (přesměrování v hlavičce ji pak respektuje). */
document.querySelectorAll(".lang a").forEach(a => a.addEventListener("click", () => {
  try { localStorage.setItem("vride-lang", a.dataset.lang); } catch {}
}));

const statusEl = document.getElementById("status");
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = "status " + cls; }

const form = document.getElementById("waitlist");
form.addEventListener("submit", async e => {
  e.preventDefault();
  if (form.website.value) return; // ochrana proti botům
  const email = form.email.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || email.length > 254) return setStatus(T.errEmail, "err");
  if (!document.getElementById("consent").checked) return setStatus(T.errConsent, "err");

  const btn = form.querySelector(".submit"); btn.disabled = true;
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/waitlist", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ email, lang: PAGE_LANG })
    });
    if (res.ok || res.status === 409) { // 409 = e-mail už v seznamu je
      setStatus(T.ok, "ok"); form.reset();
    } else throw new Error(res.status);
  } catch { setStatus(T.errNet, "err"); }
  btn.disabled = false;
});
</script>
